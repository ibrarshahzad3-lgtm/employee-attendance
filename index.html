<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <title>Employee Attendance</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc
        );

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .container {

      width: 100%;

      max-width: 430px;

    }


    .card {

      background: white;

      border-radius: 22px;

      padding: 30px 25px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.10);

      text-align: center;

    }


    .logo {

      width: 70px;

      height: 70px;

      margin:
        0 auto 15px;

      border-radius: 50%;

      background: #2563eb;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      font-weight: bold;

    }


    h1 {

      margin: 0;

      color: #111827;

      font-size: 25px;

    }


    .subtitle {

      margin-top: 8px;

      margin-bottom: 25px;

      color: #6b7280;

      font-size: 14px;

    }


    .input {

      width: 100%;

      padding: 16px;

      border:
        1px solid #d1d5db;

      border-radius: 12px;

      font-size: 20px;

      text-align: center;

      outline: none;

      letter-spacing: 5px;

    }


    .input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,0.12);

    }


    .button {

      width: 100%;

      margin-top: 15px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      touch-action: manipulation;

    }


    .button:hover {

      background: #1d4ed8;

    }


    .button:disabled {

      background: #9ca3af;

      cursor: not-allowed;

    }


    .logout {

      background: #dc2626;

    }


    .logout:hover {

      background: #b91c1c;

    }


    .employee {

      display: none;

    }


    .employee-name {

      font-size: 23px;

      font-weight: bold;

      color: #111827;

      margin-bottom: 5px;

    }


    .weekly-off {

      color: #6b7280;

      font-size: 14px;

      margin-bottom: 20px;

    }


    .status {

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 18px;

      font-size: 16px;

      font-weight: bold;

    }


    .status-login {

      background: #dcfce7;

      color: #166534;

    }


    .status-logout {

      background: #f3f4f6;

      color: #374151;

    }


    .message {

      display: none;

      margin-top: 18px;

      padding: 13px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.5;

      word-break: break-word;

    }


    .error {

      background: #fee2e2;

      color: #991b1b;

    }


    .success {

      background: #dcfce7;

      color: #166534;

    }


    .location {

      margin-top: 12px;

      color: #6b7280;

      font-size: 12px;

      line-height: 1.5;

    }


    .loading {

      display: none;

      margin-top: 15px;

      color: #2563eb;

      font-size: 14px;

      font-weight: bold;

    }


    .back {

      margin-top: 15px;

      background: transparent;

      color: #6b7280;

      border:
        1px solid #d1d5db;

    }


    .back:hover {

      background: #f3f4f6;

      color: #374151;

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <div class="logo">
      ✓
    </div>


    <h1>
      Employee Attendance
    </h1>


    <div class="subtitle">
      Enter your employee PIN
    </div>


    <!-- ========================================= -->
    <!-- PIN SECTION -->
    <!-- ========================================= -->

    <div id="pinSection">

      <input
        id="pin"
        class="input"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="PIN"
        maxlength="20"
      >


      <button
        id="verifyButton"
        class="button"
        type="button"
        onclick="verifyEmployee()"
      >
        Continue
      </button>

    </div>


    <!-- ========================================= -->
    <!-- EMPLOYEE SECTION -->
    <!-- ========================================= -->

    <div
      id="employeeSection"
      class="employee"
    >


      <div
        id="employeeName"
        class="employee-name"
      ></div>


      <div
        id="weeklyOff"
        class="weekly-off"
      ></div>


      <div
        id="status"
        class="status status-logout"
      >
        Currently Logged Out
      </div>


      <button
        id="attendanceButton"
        class="button"
        type="button"
        onclick="markAttendance()"
      >
        Login
      </button>


      <button
        class="button back"
        type="button"
        onclick="resetPage()"
      >
        Change Employee
      </button>


    </div>


    <!-- ========================================= -->
    <!-- LOADING -->
    <!-- ========================================= -->

    <div
      id="loading"
      class="loading"
    >
      Please wait...
    </div>


    <!-- ========================================= -->
    <!-- MESSAGE -->
    <!-- ========================================= -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- ========================================= -->
    <!-- LOCATION -->
    <!-- ========================================= -->

    <div
      id="locationInfo"
      class="location"
    ></div>


  </div>

</div>


<script>


// =====================================================
// APPS SCRIPT API URL
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyaySk6Ti-5u5fu0P9IOqoLuTS_he4TpyDLudI2X0IZz4CTh4j4ywW3ywkWLxRvktux/exec";


// =====================================================
// VARIABLES
// =====================================================

let currentPIN = "";

let currentEmployee = null;


// =====================================================
// JSONP API CALL
// =====================================================

function callAPI(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "attendanceCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      let timeout;


      function cleanup() {

        if (
          window[callbackName]
        ) {

          delete window[
            callbackName
          ];

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        if (timeout) {

          clearTimeout(
            timeout
          );

        }

      }


      window[callbackName] =
        function(response) {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          if (
            response &&
            response.success
          ) {

            resolve(
              response.data
            );

          } else {

            reject(
              new Error(
                response &&
                response.error
                  ? response.error
                  : "Server error."
              )
            );

          }

        };


      const query =
        new URLSearchParams();


      Object.keys(params)
        .forEach(
          function(key) {

            query.set(
              key,
              params[key]
            );

          }
        );


      query.set(
        "api",
        "1"
      );


      query.set(
        "callback",
        callbackName
      );


      query.set(
        "_",
        Date.now().toString()
      );


      script.src =
        API_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          reject(
            new Error(
              "Unable to connect to attendance server."
            )
          );

        };


      document.body
        .appendChild(
          script
        );


      timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                "Attendance server timeout. Please try again."
              )
            );

          },
          20000
        );

    }
  );

}


// =====================================================
// ENTER KEY
// =====================================================

document
  .getElementById("pin")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        verifyEmployee();

      }

    }
  );


// =====================================================
// VERIFY EMPLOYEE
// =====================================================

async function verifyEmployee() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  clearMessage();


  if (!pin) {

    showError(
      "Please enter your PIN."
    );

    return;

  }


  const button =
    document
      .getElementById(
        "verifyButton"
      );


  button.disabled =
    true;


  setLoading(
    true,
    "Checking employee..."
  );


  try {

    const result =
      await callAPI({

        action:
          "verify",

        pin:
          pin

      });


    if (
      !result ||
      !result.name
    ) {

      throw new Error(
        "Unable to verify employee."
      );

    }


    currentPIN =
      pin;


    currentEmployee =
      result;


    showEmployee(
      result
    );


    showSuccess(
      "✓ Employee verified successfully."
    );


  }

  catch (
    error
  ) {

    showError(
      getErrorMessage(
        error
      )
    );

  }

  finally {

    setLoading(
      false
    );

    button.disabled =
      false;

  }

}


// =====================================================
// SHOW EMPLOYEE
// =====================================================

function showEmployee(
  employee
) {

  document
    .getElementById(
      "pinSection"
    )
    .style
    .display =
    "none";


  document
    .getElementById(
      "employeeSection"
    )
    .style
    .display =
    "block";


  document
    .getElementById(
      "employeeName"
    )
    .textContent =
    "👤 " +
    employee.name;


  document
    .getElementById(
      "weeklyOff"
    )
    .textContent =
    employee.weeklyOff
      ? "Weekly Off: " +
        employee.weeklyOff
      : "";


  updateStatus(
    employee.status
  );

}


// =====================================================
// UPDATE STATUS
// =====================================================

function updateStatus(
  status
) {

  const statusElement =
    document.getElementById(
      "status"
    );


  const button =
    document.getElementById(
      "attendanceButton"
    );


  if (
    status === "Login"
  ) {

    statusElement
      .textContent =
      "🟢 Currently Logged In";


    statusElement
      .className =
      "status status-login";


    button
      .textContent =
      "🔴 Logout";


    button
      .className =
      "button logout";

  }

  else {

    statusElement
      .textContent =
      "🔴 Currently Logged Out";


    statusElement
      .className =
      "status status-logout";


    button
      .textContent =
      "🟢 Login";


    button
      .className =
      "button";

  }

}


// =====================================================
// LOGIN / LOGOUT
// =====================================================

async function markAttendance() {

  if (
    !currentPIN ||
    !currentEmployee
  ) {

    showError(
      "Please verify your PIN first."
    );

    return;

  }


  clearMessage();

  clearLocation();


  const action =
    currentEmployee.status === "Login"
      ? "Logout"
      : "Login";


  const button =
    document.getElementById(
      "attendanceButton"
    );


  button.disabled =
    true;


  setLoading(
    true,
    "Getting your location..."
  );


  if (
    !navigator.geolocation
  ) {

    setLoading(
      false
    );

    button.disabled =
      false;

    showError(
      "Location services are not supported by this device."
    );

    return;

  }


  navigator.geolocation
    .getCurrentPosition(

      async function(position) {

        try {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          document
            .getElementById(
              "locationInfo"
            )
            .textContent =
              "📍 GPS accuracy: approximately " +
              Math.round(
                accuracy
              ) +
              " meters";


          setLoading(
            true,
            "Checking company location..."
          );


          const result =
            await callAPI({

              action:
                "attendance",

              pin:
                currentPIN,

              attendanceAction:
                action,

              latitude:
                latitude,

              longitude:
                longitude

            });


          if (
            !result
          ) {

            throw new Error(
              "Attendance could not be recorded."
            );

          }


          currentEmployee.status =
            result.status;


          updateStatus(
            result.status
          );


          showSuccess(
            "✓ " +
            result.name +
            " " +
            (
              result.status === "Login"
                ? "logged in"
                : "logged out"
            ) +
            " successfully."
          );


          document
            .getElementById(
              "locationInfo"
            )
            .textContent =
              "📍 Location verified. " +
              "Distance from company: " +
              result.distance +
              " meters.";

        }

        catch (
          error
        ) {

          showError(
            getErrorMessage(
              error
            )
          );

          document
            .getElementById(
              "locationInfo"
            )
            .textContent =
            "🔴 Location/attendance check failed.";

        }

        finally {

          setLoading(
            false
          );

          button.disabled =
            false;

        }

      },

      function(error) {

        setLoading(
          false
        );

        button.disabled =
          false;


        let message =
          "Unable to get your location.";


        if (
          error.code ===
          error.PERMISSION_DENIED
        ) {

          message =
            "Location permission was denied. Please allow location access and try again.";

        }

        else if (
          error.code ===
          error.POSITION_UNAVAILABLE
        ) {

          message =
            "Your location is currently unavailable. Please turn on GPS and try again.";

        }

        else if (
          error.code ===
          error.TIMEOUT
        ) {

          message =
            "Location request timed out. Please try again.";

        }


        showError(
          message
        );

      },

      {

        enableHighAccuracy:
          true,

        timeout:
          15000,

        maximumAge:
          0

      }

    );

}


// =====================================================
// RESET PAGE
// =====================================================

function resetPage() {

  currentPIN =
    "";

  currentEmployee =
    null;


  document
    .getElementById(
      "pin"
    )
    .value =
    "";


  document
    .getElementById(
      "employeeSection"
    )
    .style
    .display =
    "none";


  document
    .getElementById(
      "pinSection"
    )
    .style
    .display =
    "block";


  clearMessage();

  clearLocation();


  document
    .getElementById(
      "pin"
    )
    .focus();

}


// =====================================================
// LOADING
// =====================================================

function setLoading(
  visible,
  text
) {

  const loading =
    document.getElementById(
      "loading"
    );


  if (
    visible
  ) {

    loading.style.display =
      "block";

    loading.textContent =
      text ||
      "Please wait...";

  }

  else {

    loading.style.display =
      "none";

  }

}


// =====================================================
// SUCCESS MESSAGE
// =====================================================

function showSuccess(
  message
) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    message;


  element.className =
    "message success";


  element.style.display =
    "block";

}


// =====================================================
// ERROR MESSAGE
// =====================================================

function showError(
  message
) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    message;


  element.className =
    "message error";


  element.style.display =
    "block";

}


// =====================================================
// CLEAR MESSAGE
// =====================================================

function clearMessage() {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    "";


  element.style.display =
    "none";

}


// =====================================================
// CLEAR LOCATION
// =====================================================

function clearLocation() {

  document
    .getElementById(
      "locationInfo"
    )
    .textContent =
    "";

}


// =====================================================
// ERROR MESSAGE
// =====================================================

function getErrorMessage(
  error
) {

  if (
    error &&
    error.message
  ) {

    return error.message;

  }


  return (
    "Unable to connect to attendance server. " +
    "Please try again."
  );

}

</script>


</body>

</html>
