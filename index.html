<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color"
      content="#2563eb">

<link rel="manifest"
      href="./manifest.webmanifest">

<title>Employee Attendance</title>

<style>

* {
  box-sizing: border-box;
}

body {

  font-family: Arial, sans-serif;

  background: #f3f4f6;

  text-align: center;

  padding: 30px 15px;

  margin: 0;

  -webkit-text-size-adjust: 100%;

}

.box {

  max-width: 420px;

  margin: auto;

  background: white;

  padding: 30px 20px;

  border-radius: 18px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.1);

}

h1 {

  margin-bottom: 25px;

}

input {

  width: 100%;

  padding: 15px;

  font-size: 20px;

  border-radius: 10px;

  border: 1px solid #ccc;

  margin-bottom: 15px;

  text-align: center;

  letter-spacing: 5px;

  -webkit-appearance: none;

}

button {

  width: 100%;

  padding: 17px;

  margin: 8px 0;

  border: none;

  border-radius: 10px;

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  -webkit-appearance: none;

  touch-action: manipulation;

}

button:active {

  transform: scale(.98);

}

.verify {

  background: #2563eb;

}

.login {

  background: #16a34a;

}

.logout {

  background: #dc2626;

}

.exit {

  background: #6b7280;

}

.install {

  background: #111827;

}

.hidden {

  display: none !important;

}

#employeeName {

  font-size: 22px;

  font-weight: bold;

  margin: 15px 0 5px;

}

#weeklyOff {

  color: #666;

  margin-bottom: 15px;

}

#currentStatus {

  margin: 15px 0;

  font-size: 18px;

  font-weight: bold;

}

#message {

  margin-top: 20px;

  font-weight: bold;

  min-height: 24px;

}

</style>

</head>


<body>

<div class="box">

<h1>
  Employee Attendance
</h1>


<!-- PIN -->

<div id="loginSection">

<input
  type="password"
  id="pin"
  placeholder="Enter PIN"
  inputmode="numeric"
  pattern="[0-9]*"
  maxlength="6"
  autocomplete="off">

<button
  type="button"
  class="verify"
  id="verifyButton">

🔐 VERIFY PIN

</button>


<button
  type="button"
  id="installButton"
  class="install hidden">

📲 INSTALL APP

</button>

</div>


<!-- EMPLOYEE -->

<div
  id="employeeSection"
  class="hidden">

<div id="employeeName"></div>

<div id="weeklyOff"></div>

<div id="currentStatus">
Current Status
</div>


<button
  type="button"
  class="login"
  id="loginButton">

🟢 LOGIN

</button>


<button
  type="button"
  class="logout"
  id="logoutButton">

🔴 LOGOUT

</button>


<button
  type="button"
  class="exit"
  id="exitButton">

🔒 EXIT

</button>

</div>


<div id="message"></div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz04PnAKUm_ozjmvsyFnDlV9BW5pIenR6slTzBmNA7wTpA4TC3SLlSSap6yhysMvFPm/exec";


/* =====================================================
   VARIABLES
===================================================== */

let verified = false;

let verifiedPIN = "";

let deferredPrompt = null;


/* =====================================================
   SAFARI-FRIENDLY JSONP API
===================================================== */

function callAPI(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "attendanceCallback" +
      Date.now() +
      Math.floor(
        Math.random() * 100000
      );


    let finished = false;


    const script =
      document.createElement("script");


    function cleanup() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

    }


    window[callbackName] =
      function(response) {

        cleanup();


        if (
          response &&
          response.success
        ) {

          resolve(response.data);

        } else {

          reject(
            new Error(
              response &&
              response.error
                ? response.error
                : "Server error."
            )
          );

        }

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "Unable to connect to attendance server."
          )
        );

      };


    const query =
      new URLSearchParams();


    Object.keys(params).forEach(
      function(key) {

        query.set(
          key,
          params[key]
        );

      }
    );


    query.set(
      "api",
      "1"
    );


    query.set(
      "callback",
      callbackName
    );


    /* Prevent Safari/cache from reusing old request */

    query.set(
      "_",
      Date.now().toString()
    );


    script.src =
      API_URL +
      "?" +
      query.toString();


    script.async = true;


    document
      .head
      .appendChild(script);


    /* 20 second timeout */

    const timeout =
      setTimeout(
        function() {

          if (!finished) {

            cleanup();

            reject(
              new Error(
                "Attendance server timeout. Please try again."
              )
            );

          }

        },
        20000
      );

  });

}


/* =====================================================
   VERIFY
===================================================== */

async function verifyEmployee() {

  const pinInput =
    document.getElementById("pin");


  const pin =
    pinInput.value.trim();


  if (!pin) {

    showMessage(
      "Please enter your PIN.",
      "red"
    );

    pinInput.focus();

    return;

  }


  showMessage(
    "Verifying...",
    "#333"
  );


  const button =
    document.getElementById(
      "verifyButton"
    );


  button.disabled = true;

  button.style.opacity = "0.6";


  try {

    const result =
      await callAPI({

        action: "verify",

        pin: pin

      });


    verified = true;

    verifiedPIN = pin;


    document
      .getElementById(
        "loginSection"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "employeeSection"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "employeeName"
      )
      .textContent =
      "👤 " + result.name;


    document
      .getElementById(
        "weeklyOff"
      )
      .textContent =
      "Weekly Off: " +
      result.weeklyOff;


    updateStatus(
      result.status
    );


    showMessage(
      "✓ Verified successfully.",
      "green"
    );


  } catch (error) {

    showMessage(
      error.message,
      "red"
    );

  } finally {

    button.disabled = false;

    button.style.opacity = "1";

  }

}


/* =====================================================
   LOGIN / LOGOUT
===================================================== */

async function markAttendance(action) {

  if (!verified || !verifiedPIN) {
    return;
  }


  showMessage(
    "Saving...",
    "#333"
  );


  const button =
    action === "Login"
      ? document.getElementById("loginButton")
      : document.getElementById("logoutButton");


  button.disabled = true;

  button.style.opacity = "0.6";


  try {

    const result =
      await callAPI({

        action: "attendance",

        pin: verifiedPIN,

        attendanceAction: action

      });


    if (action === "Login") {

      showMessage(
        "✓ " +
        result.name +
        " is Logged In",
        "green"
      );

      updateStatus("Login");

    } else {

      showMessage(
        "✓ " +
        result.name +
        " is Logged Out",
        "green"
      );

      updateStatus("Logout");

    }


  } catch (error) {

    showMessage(
      error.message,
      "red"
    );

  } finally {

    button.disabled = false;

    button.style.opacity = "1";

  }

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(status) {

  const box =
    document.getElementById(
      "currentStatus"
    );


  if (status === "Login") {

    box.style.color =
      "#16a34a";

    box.textContent =
      "🟢 Current Status: LOGIN";

  } else {

    box.style.color =
      "#dc2626";

    box.textContent =
      "🔴 Current Status: LOGOUT";

  }

}


/* =====================================================
   EXIT
===================================================== */

function exitUser() {

  verified = false;

  verifiedPIN = "";


  document
    .getElementById(
      "employeeSection"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "loginSection"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "pin"
    )
    .value = "";


  document
    .getElementById(
      "employeeName"
    )
    .textContent = "";


  document
    .getElementById(
      "weeklyOff"
    )
    .textContent = "";


  document
    .getElementById(
      "currentStatus"
    )
    .textContent =
    "Current Status";


  showMessage(
    "",
    "#333"
  );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  color
) {

  const message =
    document.getElementById(
      "message"
    );


  message.style.color =
    color;


  message.textContent =
    text;

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

document
  .getElementById(
    "verifyButton"
  )
  .addEventListener(
    "click",
    verifyEmployee
  );


document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    function() {

      markAttendance("Login");

    }
  );


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    function() {

      markAttendance("Logout");

    }
  );


document
  .getElementById(
    "exitButton"
  )
  .addEventListener(
    "click",
    exitUser
  );


/* Allow Enter key on PIN */

document
  .getElementById("pin")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        verifyEmployee();

      }

    }
  );


/* =====================================================
   PWA INSTALL
===================================================== */

window.addEventListener(
  "beforeinstallprompt",
  function(event) {

    event.preventDefault();

    deferredPrompt =
      event;


    document
      .getElementById(
        "installButton"
      )
      .classList.remove(
        "hidden"
      );

  }
);


document
  .getElementById(
    "installButton"
  )
  .addEventListener(
    "click",
    async function() {

      if (!deferredPrompt) {

        alert(
          "On iPhone use Safari → Share → Add to Home Screen."
        );

        return;

      }


      deferredPrompt.prompt();


      await deferredPrompt.userChoice;


      deferredPrompt = null;


      document
        .getElementById(
          "installButton"
        )
        .classList.add(
          "hidden"
        );

    }
  );


/* =====================================================
   SERVICE WORKER
===================================================== */

/*
   Temporarily disabled while testing the
   iPhone connection.

   This prevents an old cached version of
   index.html from being loaded on iPhone.

   After everything works, we can enable PWA
   caching again safely.
*/

</script>

</body>

</html>
