<body>

<div class="container">

  <div class="card">


    <!-- LOGO -->

    <div class="logo-wrapper">

      <div class="logo">
        ✓
      </div>

    </div>


    <h1>
      Employee Attendance
    </h1>


    <div class="brand">
      FLOWARD
    </div>


    <div class="subtitle">
      Secure employee attendance
    </div>


    <!-- PIN SECTION -->

    <div id="pinSection">

      <input
        id="pin"
        class="input"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter PIN"
        maxlength="20"
      >

      <button
        id="verifyButton"
        class="button"
        type="button"
        onclick="verifyEmployee()"
      >
        Continue
      </button>

    </div>


    <!-- EMPLOYEE SECTION -->

    <div
      id="employeeSection"
      class="employee"
    >

      <div
        id="employeeName"
        class="employee-name"
      ></div>


      <div
        id="weeklyOff"
        class="weekly-off"
      ></div>


      <div
        id="status"
        class="status status-logout"
      >
        Currently Logged Out
      </div>


      <button
        id="attendanceButton"
        class="button"
        type="button"
        onclick="markAttendance()"
      >
        🟢 Login
      </button>


      <button
        class="button back"
        type="button"
        onclick="resetPage()"
      >
        Change Employee
      </button>


      <!-- LOCATION -->

          📍 Location Verification
        </div>

          id="locationInfo"

        >

        Please wait...

    </div>

    <div
      id="message"
      class="message"
    ></div>

      Attendance is allowed only within
      <strong>200 meters</strong>
      of the company location.

<script>


// =====================================================
// APPS SCRIPT API URL
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyaySk6Ti-5u5fu0P9IOqoLuTS_he4TpyDLudI2X0IZz4CTh4j4ywW3ywkWLxRvktux/exec";


// =====================================================
// VARIABLES
// =====================================================

let currentPIN = "";

let currentEmployee = null;


// =====================================================
// JSONP API CALL
// =====================================================

function callAPI(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "attendanceCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement("script");


    let finished = false;


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "Unable to connect to attendance server. Please try again."
          )
        );

      }, 20000);


    function cleanup() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);


      try {
        delete window[callbackName];
      }

      catch (e) {
        window[callbackName] = undefined;
      }


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    window[callbackName] =
      function(response) {

        cleanup();


        if (
          response &&
          response.success
        ) {

          resolve(
            response.data
          );

        }

        else {

          reject(
            new Error(
              response &&
              response.error
                ? response.error
                : "Attendance server error."
            )
          );

        }

      };


    const query =
      new URLSearchParams();


    Object.keys(params).forEach(
      function(key) {

        query.set(
          key,
          params[key]
        );

      }
    );


    query.set(
      "api",
      "1"
    );


    query.set(
      "callback",
      callbackName
    );


    query.set(
      "_",
      Date.now().toString()
    );


    script.src =
      API_URL +
      "?" +
      query.toString();


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "Unable to connect to attendance server."
          )
        );

      };


    document.body.appendChild(
      script
    );

  });

}


// =====================================================
// VERIFY EMPLOYEE
// =====================================================

async function verifyEmployee() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  clearMessage();


  if (!pin) {

    showError(
      "Please enter your employee PIN."
    );

    return;
  }


  const button =
    document.getElementById(
      "verifyButton"
    );


  button.disabled = true;


  setLoading(
    true,
    "Checking employee..."
  );


  try {

    const result =
      await callAPI({

        action: "verify",

        pin: pin

      });


    if (!result) {

      throw new Error(
        "No employee information received."
      );

    }


    currentPIN =
      pin;


    currentEmployee =
      result;


    showEmployee(
      result
    );


    showSuccess(
      "Employee verified successfully."
    );

  }

  catch(error) {

    showError(
      getErrorMessage(error)
    );

  }

  finally {

    button.disabled = false;

    setLoading(false);

  }

}


// =====================================================
// SHOW EMPLOYEE
// =====================================================

function showEmployee(employee) {

  document
    .getElementById("pinSection")
    .style.display = "none";


  document
    .getElementById("employeeSection")
    .style.display = "block";


  document
    .getElementById("employeeName")
    .textContent =
      "👤 " + employee.name;


  document
    .getElementById("weeklyOff")
    .textContent =
      employee.weeklyOff
        ? "Weekly Off: " +
          employee.weeklyOff
        : "";


  updateStatus(
    employee.status
  );


  updateLocation(
    "📍 Location will be verified before attendance is recorded."
  );

}


// =====================================================
// UPDATE STATUS
// =====================================================

function updateStatus(status) {

  const statusElement =
    document.getElementById(
      "status"
    );


  const button =
    document.getElementById(
      "attendanceButton"
    );


  if (
    status === "Login"
  ) {

    statusElement.textContent =
      "🟢 Currently Logged In";


    statusElement.className =
      "status status-login";


    button.textContent =
      "🔴 Logout";


    button.className =
      "button logout";

  }

  else {

    statusElement.textContent =
      "⚪ Currently Logged Out";


    statusElement.className =
      "status status-logout";


    button.textContent =
      "🟢 Login";


    button.className =
      "button";

  }

}


// =====================================================
// MARK ATTENDANCE
// =====================================================

async function markAttendance() {

  if (
    !currentPIN ||
    !currentEmployee
  ) {

    showError(
      "Please verify your PIN first."
    );

    return;
  }


  clearMessage();


  const action =
    currentEmployee.status === "Login"
      ? "Logout"
      : "Login";


  const button =
    document.getElementById(
      "attendanceButton"
    );


  button.disabled = true;


  setLoading(
    true,
    "Getting your GPS location..."
  );


  updateLocation(
    "📍 Requesting GPS location..."
  );


  if (
    !navigator.geolocation
  ) {

    setLoading(false);

    button.disabled = false;

    showError(
      "Location services are not supported on this device."
    );

    return;
  }


  try {

    const position =
      await getCurrentLocation();


    const latitude =
      position.coords.latitude;


    const longitude =
      position.coords.longitude;


    const accuracy =
      position.coords.accuracy;


    updateLocation(
      "📍 GPS found. Accuracy: approximately " +
      Math.round(accuracy) +
      " meters. Checking company area..."
    );


    setLoading(
      true,
      "Checking company location..."
    );


    const result =
      await callAPI({

        action: "attendance",

        pin: currentPIN,

        attendanceAction: action,

        latitude: latitude,

        longitude: longitude

      });


    if (!result) {

      throw new Error(
        "Attendance server returned no result."
      );

    }


    currentEmployee.status =
      result.status;


    updateStatus(
      result.status
    );


    updateLocation(
      "🟢 Location verified. Distance from company: " +
      result.distance +
      " meters."
    );


    showSuccess(

      result.name +
      " " +
      (
        result.status === "Login"
          ? "logged in"
          : "logged out"
      ) +
      " successfully at " +
      (
        result.time || ""
      )

    );

  }

  catch(error) {

    updateLocation(
      "🔴 Location verification failed."
    );


    showError(
      getErrorMessage(error)
    );

  }

  finally {

    setLoading(false);

    button.disabled = false;

  }

}


// =====================================================
// GET GPS LOCATION
// =====================================================

function getCurrentLocation() {

  return new Promise(
    function(resolve, reject) {

      navigator.geolocation.getCurrentPosition(

        function(position) {

          resolve(position);

        },

        function(error) {

          let message =
            "Unable to get your location.";


          if (
            error.code ===
            error.PERMISSION_DENIED
          ) {

            message =
              "Location permission was denied. Please allow location access and try again.";

          }

          else if (
            error.code ===
            error.POSITION_UNAVAILABLE
          ) {

            message =
              "Your location is unavailable. Please turn on GPS and try again.";

          }

          else if (
            error.code ===
            error.TIMEOUT
          ) {

            message =
              "Location request timed out. Please try again.";

          }


          reject(
            new Error(message)
          );

        },

        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        }

      );

    }
  );

}


// =====================================================
// RESET
// =====================================================

function resetPage() {

  currentPIN = "";

  currentEmployee = null;


  document
    .getElementById("pin")
    .value = "";


  document
    .getElementById("employeeSection")
    .style.display = "none";


  document
    .getElementById("pinSection")
    .style.display = "block";


  clearMessage();


  setLoading(false);


  updateLocation(
    "Location will be checked before Login or Logout."
  );


  setTimeout(
    function() {

      document
        .getElementById("pin")
        .focus();

    },
    100
  );

}


// =====================================================
// LOCATION TEXT
// =====================================================

function updateLocation(text) {

  document
    .getElementById("locationInfo")
    .textContent = text;

}


// =====================================================
// LOADING
// =====================================================

function setLoading(
  visible,
  text
) {

  const loading =
    document.getElementById(
      "loading"
    );


  const loadingText =
    document.getElementById(
      "loadingText"
    );


  if (visible) {

    loading.style.display =
      "block";


    loadingText.textContent =
      text ||
      "Please wait...";

  }

  else {

    loading.style.display =
      "none";

  }

}


// =====================================================
// SUCCESS
// =====================================================

function showSuccess(message) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    "✓ " + message;


  element.className =
    "message success";


  element.style.display =
    "block";

}


// =====================================================
// ERROR
// =====================================================

function showError(message) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    message;


  element.className =
    "message error";


  element.style.display =
    "block";

}


// =====================================================
// CLEAR MESSAGE
// =====================================================

function clearMessage() {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    "";


  element.style.display =
    "none";

}


// =====================================================
// ERROR MESSAGE
// =====================================================

function getErrorMessage(error) {

  if (
    error &&
    error.message
  ) {

    return error.message;

  }


  return (
    "Unable to connect to attendance server. Please try again."
  );

}


// =====================================================
// ENTER KEY
// =====================================================

document
  .getElementById("pin")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        verifyEmployee();

      }

    }
  );


</script>

</body>
