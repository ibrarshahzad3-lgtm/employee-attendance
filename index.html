<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color"
      content="#2563eb">

<link rel="manifest"
      href="./manifest.webmanifest">

<title>Employee Attendance</title>


<style>

* {
  box-sizing: border-box;
}

body {

  font-family:
    Arial,
    sans-serif;

  background:
    #f3f4f6;

  text-align:
    center;

  padding:
    30px 15px;

  margin:
    0;

  -webkit-text-size-adjust:
    100%;
}


.box {

  max-width:
    420px;

  margin:
    auto;

  background:
    white;

  padding:
    30px 20px;

  border-radius:
    18px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.1);

}


h1 {

  margin-bottom:
    25px;

}


input {

  width:
    100%;

  padding:
    15px;

  font-size:
    20px;

  border-radius:
    10px;

  border:
    1px solid #ccc;

  margin-bottom:
    15px;

  text-align:
    center;

  letter-spacing:
    5px;

  -webkit-appearance:
    none;

}


button {

  width:
    100%;

  padding:
    17px;

  margin:
    8px 0;

  border:
    none;

  border-radius:
    10px;

  color:
    white;

  font-size:
    18px;

  font-weight:
    bold;

  cursor:
    pointer;

  -webkit-appearance:
    none;

  touch-action:
    manipulation;

}


button:disabled {

  opacity:
    .6;

  cursor:
    not-allowed;

}


.verify {

  background:
    #2563eb;

}


.login {

  background:
    #16a34a;

}


.logout {

  background:
    #dc2626;

}


.exit {

  background:
    #6b7280;

}


.install {

  background:
    #111827;

}


.hidden {

  display:
    none !important;

}


#employeeName {

  font-size:
    22px;

  font-weight:
    bold;

  margin:
    15px 0 5px;

}


#weeklyOff {

  color:
    #666;

  margin-bottom:
    15px;

}


#currentStatus {

  margin:
    15px 0;

  font-size:
    18px;

  font-weight:
    bold;

}


#locationStatus {

  margin:
    10px 0;

  font-size:
    16px;

  font-weight:
    bold;

}


#message {

  margin-top:
    20px;

  font-weight:
    bold;

  min-height:
    24px;

}


</style>

</head>


<body>


<div class="box">


<h1>
Employee Attendance
</h1>


<!-- =================================================
     LOGIN SECTION
================================================= -->

<div id="loginSection">


<input
  type="password"
  id="pin"
  placeholder="Enter PIN"
  inputmode="numeric"
  pattern="[0-9]*"
  maxlength="6"
  autocomplete="off">


<button
  type="button"
  class="verify"
  id="verifyButton">

🔐 VERIFY PIN

</button>


<button
  type="button"
  id="installButton"
  class="install hidden">

📲 INSTALL APP

</button>


</div>


<!-- =================================================
     EMPLOYEE SECTION
================================================= -->

<div
  id="employeeSection"
  class="hidden">


<div id="employeeName"></div>


<div id="weeklyOff"></div>


<div id="currentStatus">
Current Status
</div>


<div id="locationStatus">
📍 Location: Not Checked
</div>


<button
  type="button"
  class="login"
  id="loginButton">

🟢 LOGIN

</button>


<button
  type="button"
  class="logout"
  id="logoutButton">

🔴 LOGOUT

</button>


<button
  type="button"
  class="exit"
  id="exitButton">

🔒 EXIT

</button>


</div>


<div id="message"></div>


</div>


<script>


// =====================================================
// API URL
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwbUQQ3Ewz3RJHnET6c7YOPVBiWxX-dXJsm0yt58pJGgCp8shePNS0MEQ1AUmopqWzG/exec";


let verified =
  false;


let verifiedPIN =
  "";


let deferredPrompt =
  null;


// =====================================================
// JSONP API
// =====================================================

function callAPI(
  params
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const callbackName =
        "attendanceCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      const cleanup =
        function() {

          if (
            finished
          ) {
            return;
          }

          finished =
            true;


          if (
            window[
              callbackName
            ]
          ) {

            delete window[
              callbackName
            ];

          }


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }


          clearTimeout(
            timeout
          );

        };


      window[
        callbackName
      ] =
        function(
          response
        ) {

          cleanup();


          if (
            response &&
            response.success
          ) {

            resolve(
              response.data
            );

          }

          else {

            reject(
              new Error(
                response &&
                response.error
                  ? response.error
                  : "Server error."
              )
            );

          }

        };


      const query =
        new URLSearchParams();


      Object.keys(
        params
      )
      .forEach(
        function(key) {

          query.set(
            key,
            params[key]
          );

        }
      );


      query.set(
        "api",
        "1"
      );


      query.set(
        "callback",
        callbackName
      );


      query.set(
        "_",
        Date.now()
          .toString()
      );


      script.src =
        API_URL +
        "?" +
        query.toString();


      script.onerror =
        function() {

          cleanup();


          reject(
            new Error(
              "Unable to connect to attendance server."
            )
          );

        };


      document.body
        .appendChild(
          script
        );


      const timeout =
        setTimeout(
          function() {

            cleanup();


            reject(
              new Error(
                "Attendance server timeout. Please try again."
              )
            );

          },
          20000
        );

    }
  );

}


// =====================================================
// VERIFY
// =====================================================

async function verifyEmployee() {

  const pin =
    document
      .getElementById(
        "pin"
      )
      .value
      .trim();


  if (!pin) {

    showMessage(
      "Please enter your PIN.",
      "red"
    );

    return;

  }


  showMessage(
    "Verifying...",
    "#333"
  );


  const button =
    document
      .getElementById(
        "verifyButton"
      );


  button.disabled =
    true;


  try {

    const result =
      await callAPI({

        action:
          "verify",

        pin:
          pin

      });


    verified =
      true;


    verifiedPIN =
      pin;


    document
      .getElementById(
        "loginSection"
      )
      .classList
      .add(
        "hidden"
      );


    document
      .getElementById(
        "employeeSection"
      )
      .classList
      .remove(
        "hidden"
      );


    document
      .getElementById(
        "employeeName"
      )
      .textContent =
        "👤 " +
        result.name;


    document
      .getElementById(
        "weeklyOff"
      )
      .textContent =
        "Weekly Off: " +
        result.weeklyOff;


    updateStatus(
      result.status
    );


    updateLocationStatus(
      "📍 Location: Ready to check",
      "#666"
    );


    showMessage(
      "✓ Verified successfully.",
      "green"
    );


  }

  catch (
    error
  ) {

    showMessage(
      error.message,
      "red"
    );

  }


  finally {

    button.disabled =
      false;

  }

}


// =====================================================
// GET CURRENT LOCATION
// =====================================================

function getCurrentLocation() {

  return new Promise(
    function(
      resolve,
      reject
    ) {


      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            "Location is not supported on this device."
          )
        );

        return;

      }


      navigator.geolocation
        .getCurrentPosition(

          function(
            position
          ) {

            resolve(
              position
            );

          },


          function(
            error
          ) {


            if (
              error.code ===
              error.PERMISSION_DENIED
            ) {

              reject(
                new Error(
                  "Location permission denied. Please allow location access."
                )
              );

            }

            else if (
              error.code ===
              error.POSITION_UNAVAILABLE
            ) {

              reject(
                new Error(
                  "Unable to detect your location. Please try again."
                )
              );

            }

            else {

              reject(
                new Error(
                  "Location request timed out. Please try again."
                )
              );

            }

          },


          {

            enableHighAccuracy:
              true,

            timeout:
              15000,

            maximumAge:
              0

          }

        );

    }
  );

}


// =====================================================
// LOGIN / LOGOUT
// =====================================================

async function markAttendance(
  action
) {


  if (
    !verified ||
    !verifiedPIN
  ) {

    return;

  }


  showMessage(
    "📍 Checking your location...",
    "#333"
  );


  updateLocationStatus(
    "📍 Checking GPS location...",
    "#333"
  );


  const button =
    action === "Login"
      ? document
          .getElementById(
            "loginButton"
          )
      : document
          .getElementById(
            "logoutButton"
          );


  button.disabled =
    true;


  try {


    // =================================================
    // GET GPS
    // =================================================

    const position =
      await getCurrentLocation();


    const latitude =
      position.coords.latitude;


    const longitude =
      position.coords.longitude;


    updateLocationStatus(
      "📍 GPS location found. Checking company area...",
      "#333"
    );


    // =================================================
    // SEND LOCATION TO SERVER
    // =================================================

    const result =
      await callAPI({

        action:
          "attendance",

        pin:
          verifiedPIN,

        attendanceAction:
          action,

        latitude:
          latitude,

        longitude:
          longitude

      });


    // =================================================
    // SUCCESS
    // =================================================

    updateLocationStatus(
      "🟢 Location Verified - Company Area",
      "green"
    );


    if (
      action === "Login"
    ) {

      showMessage(
        "✓ " +
        result.name +
        " is Logged In",
        "green"
      );


      updateStatus(
        "Login"
      );

    }

    else {

      showMessage(
        "✓ " +
        result.name +
        " is Logged Out",
        "green"
      );


      updateStatus(
        "Logout"
      );

    }


  }


  catch (
    error
  ) {


    updateLocationStatus(
      "🔴 Outside Company Area / Location Error",
      "red"
    );


    showMessage(
      error.message,
      "red"
    );

  }


  finally {

    button.disabled =
      false;

  }

}


// =====================================================
// STATUS
// =====================================================

function updateStatus(
  status
) {

  const box =
    document
      .getElementById(
        "currentStatus"
      );


  if (
    status === "Login"
  ) {

    box.style.color =
      "#16a34a";


    box.textContent =
      "🟢 Current Status: LOGIN";

  }

  else {

    box.style.color =
      "#dc2626";


    box.textContent =
      "🔴 Current Status: LOGOUT";

  }

}


// =====================================================
// LOCATION STATUS
// =====================================================

function updateLocationStatus(
  text,
  color
) {

  const box =
    document
      .getElementById(
        "locationStatus"
      );


  box.textContent =
    text;


  box.style.color =
    color;

}


// =====================================================
// EXIT
// =====================================================

function exitUser() {

  verified =
    false;


  verifiedPIN =
    "";


  document
    .getElementById(
      "employeeSection"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "loginSection"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "pin"
    )
    .value =
    "";


  document
    .getElementById(
      "employeeName"
    )
    .textContent =
    "";


  document
    .getElementById(
      "weeklyOff"
    )
    .textContent =
    "";


  document
    .getElementById(
      "currentStatus"
    )
    .textContent =
    "Current Status";


  document
    .getElementById(
      "locationStatus"
    )
    .textContent =
    "📍 Location: Not Checked";


  document
    .getElementById(
      "locationStatus"
    )
    .style
    .color =
    "#666";


  showMessage(
    "",
    "#333"
  );

}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
  text,
  color
) {

  const message =
    document
      .getElementById(
        "message"
      );


  message.style.color =
    color;


  message.textContent =
    text;

}


// =====================================================
// BUTTONS
// =====================================================

document
  .getElementById(
    "verifyButton"
  )
  .addEventListener(
    "click",
    verifyEmployee
  );


document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    function() {

      markAttendance(
        "Login"
      );

    }
  );


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    function() {

      markAttendance(
        "Logout"
      );

    }
  );


document
  .getElementById(
    "exitButton"
  )
  .addEventListener(
    "click",
    exitUser
  );


document
  .getElementById(
    "pin"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        verifyEmployee();

      }

    }
  );


// =====================================================
// PWA INSTALL
// =====================================================

window.addEventListener(
  "beforeinstallprompt",
  function(event) {

    event.preventDefault();

    deferredPrompt =
      event;


    document
      .getElementById(
        "installButton"
      )
      .classList
      .remove(
        "hidden"
      );

  }
);


document
  .getElementById(
    "installButton"
  )
  .addEventListener(
    "click",
    async function() {


      if (
        !deferredPrompt
      ) {

        alert(
          "On iPhone: Safari → Share → Add to Home Screen."
        );

        return;

      }


      deferredPrompt
        .prompt();


      await deferredPrompt
        .userChoice;


      deferredPrompt =
        null;


      document
        .getElementById(
          "installButton"
        )
        .classList
        .add(
          "hidden"
        );

    }
  );


</script>

</body>

</html>
