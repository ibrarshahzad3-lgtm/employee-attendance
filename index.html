<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Employee Attendance</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc
        );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;

      border-radius: 22px;

      padding: 30px 25px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.10);

      text-align: center;
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 15px;

      border-radius: 50%;

      background: #2563eb;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0;

      color: #111827;

      font-size: 25px;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 25px;

      color: #6b7280;

      font-size: 14px;
    }

    .input {
      width: 100%;

      padding: 16px;

      border: 1px solid #d1d5db;

      border-radius: 12px;

      font-size: 20px;

      text-align: center;

      outline: none;

      letter-spacing: 5px;
    }

    .input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,0.12);
    }

    .button {
      width: 100%;

      margin-top: 15px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .logout {
      background: #dc2626;
    }

    .logout:hover {
      background: #b91c1c;
    }

    .employee {
      display: none;
    }

    .employee-name {
      font-size: 23px;

      font-weight: bold;

      color: #111827;

      margin-bottom: 5px;
    }

    .weekly-off {
      color: #6b7280;

      font-size: 14px;

      margin-bottom: 20px;
    }

    .status {
      padding: 14px;

      border-radius: 12px;

      margin-bottom: 18px;

      font-size: 16px;

      font-weight: bold;
    }

    .status-login {
      background: #dcfce7;
      color: #166534;
    }

    .status-logout {
      background: #f3f4f6;
      color: #374151;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 13px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.5;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .location {
      margin-top: 12px;

      color: #6b7280;

      font-size: 12px;
    }

    .loading {
      display: none;

      margin-top: 15px;

      color: #2563eb;

      font-size: 14px;
    }

    .back {
      margin-top: 15px;

      background: transparent;

      color: #6b7280;

      border: 1px solid #d1d5db;
    }

    .back:hover {
      background: #f3f4f6;

      color: #374151;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      ✓
    </div>

    <h1>
      Employee Attendance
    </h1>

    <div class="subtitle">
      Enter your employee PIN
    </div>


    <!-- ========================================= -->
    <!-- PIN SECTION -->
    <!-- ========================================= -->

    <div id="pinSection">

      <input
        id="pin"
        class="input"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="PIN"
        maxlength="20"
      >

      <button
        id="verifyButton"
        class="button"
        onclick="verifyEmployee()"
      >
        Continue
      </button>

    </div>


    <!-- ========================================= -->
    <!-- EMPLOYEE SECTION -->
    <!-- ========================================= -->

    <div
      id="employeeSection"
      class="employee"
    >

      <div
        id="employeeName"
        class="employee-name"
      ></div>

      <div
        id="weeklyOff"
        class="weekly-off"
      ></div>

      <div
        id="status"
        class="status status-logout"
      >
        Logged Out
      </div>


      <button
        id="attendanceButton"
        class="button"
        onclick="markAttendance()"
      >
        Login
      </button>


      <button
        class="button back"
        onclick="resetPage()"
      >
        Change Employee
      </button>

    </div>


    <!-- ========================================= -->
    <!-- LOADING -->
    <!-- ========================================= -->

    <div
      id="loading"
      class="loading"
    >
      Please wait...
    </div>


    <!-- ========================================= -->
    <!-- MESSAGE -->
    <!-- ========================================= -->

    <div
      id="message"
      class="message"
    ></div>


    <div
      id="locationInfo"
      class="location"
    ></div>

  </div>

</div>


<script>

  let currentPIN = "";

  let currentEmployee = null;


  // =================================================
  // ENTER KEY
  // =================================================

  document
    .getElementById("pin")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          verifyEmployee();

        }

      }
    );


  // =================================================
  // VERIFY EMPLOYEE
  // =================================================

  function verifyEmployee() {

    const pin =
      document
        .getElementById("pin")
        .value
        .trim();

    clearMessage();

    if (!pin) {

      showError(
        "Please enter your PIN."
      );

      return;

    }


    setLoading(
      true,
      "Checking employee..."
    );


    document
      .getElementById(
        "verifyButton"
      )
      .disabled = true;


    google.script.run

      .withSuccessHandler(
        function(result) {

          setLoading(
            false
          );

          document
            .getElementById(
              "verifyButton"
            )
            .disabled = false;


          if (
            !result ||
            !result.success
          ) {

            showError(
              "Unable to verify employee."
            );

            return;

          }


          currentPIN =
            pin;

          currentEmployee =
            result;


          showEmployee(
            result
          );

        }
      )

      .withFailureHandler(
        function(error) {

          setLoading(
            false
          );

          document
            .getElementById(
              "verifyButton"
            )
            .disabled = false;


          showError(
            getErrorMessage(
              error
            )
          );

        }
      )

      .verifyEmployee(
        pin
      );

  }


  // =================================================
  // SHOW EMPLOYEE
  // =================================================

  function showEmployee(
    employee
  ) {

    document
      .getElementById(
        "pinSection"
      )
      .style.display = "none";


    document
      .getElementById(
        "employeeSection"
      )
      .style.display = "block";


    document
      .getElementById(
        "employeeName"
      )
      .textContent =
        employee.name;


    document
      .getElementById(
        "weeklyOff"
      )
      .textContent =
        employee.weeklyOff
          ? "Weekly Off: " +
            employee.weeklyOff
          : "";


    updateStatus(
      employee.status
    );

  }


  // =================================================
  // UPDATE STATUS
  // =================================================

  function updateStatus(
    status
  ) {

    const statusElement =
      document.getElementById(
        "status"
      );

    const button =
      document.getElementById(
        "attendanceButton"
      );


    if (
      status === "Login"
    ) {

      statusElement
        .textContent =
          "Currently Logged In";

      statusElement
        .className =
          "status status-login";


      button
        .textContent =
          "Logout";

      button
        .className =
          "button logout";

    }

    else {

      statusElement
        .textContent =
          "Currently Logged Out";

      statusElement
        .className =
          "status status-logout";


      button
        .textContent =
          "Login";

      button
        .className =
          "button";

    }

  }


  // =================================================
  // MARK ATTENDANCE
  // =================================================

  function markAttendance() {

    if (
      !currentPIN ||
      !currentEmployee
    ) {

      showError(
        "Please verify your PIN first."
      );

      return;

    }


    clearMessage();

    clearLocation();


    const action =
      currentEmployee.status === "Login"
        ? "Logout"
        : "Login";


    const button =
      document.getElementById(
        "attendanceButton"
      );


    button.disabled = true;


    setLoading(
      true,
      "Getting your location..."
    );


    if (
      !navigator.geolocation
    ) {

      setLoading(
        false
      );

      button.disabled = false;

      showError(
        "Location services are not supported by this device."
      );

      return;

    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        document
          .getElementById(
            "locationInfo"
          )
          .textContent =
            "GPS accuracy: approximately " +
            Math.round(accuracy) +
            " meters";


        setLoading(
          true,
          "Checking company location..."
        );


        google.script.run

          .withSuccessHandler(
            function(result) {

              setLoading(
                false
              );

              button.disabled = false;


              if (
                !result ||
                !result.success
              ) {

                showError(
                  "Attendance could not be recorded."
                );

                return;

              }


              currentEmployee.status =
                result.status;


              updateStatus(
                result.status
              );


              showSuccess(
                result.name +
                " " +
                (
                  result.status === "Login"
                    ? "logged in"
                    : "logged out"
                ) +
                " successfully at " +
                result.time +
                "."
              );


              document
                .getElementById(
                  "locationInfo"
                )
                .textContent =
                  "Distance from company: " +
                  result.distance +
                  " meters";

            }
          )

          .withFailureHandler(
            function(error) {

              setLoading(
                false
              );

              button.disabled = false;


              showError(
                getErrorMessage(
                  error
                )
              );

            }
          )

          .markAttendance(
            currentPIN,
            action,
            latitude,
            longitude
          );

      },

      function(error) {

        setLoading(
          false
        );

        button.disabled = false;


        let message =
          "Unable to get your location.";


        if (
          error.code ===
          error.PERMISSION_DENIED
        ) {

          message =
            "Location permission was denied. Please allow location access and try again.";

        }

        else if (
          error.code ===
          error.POSITION_UNAVAILABLE
        ) {

          message =
            "Your location is currently unavailable. Please turn on GPS and try again.";

        }

        else if (
          error.code ===
          error.TIMEOUT
        ) {

          message =
            "Location request timed out. Please try again.";

        }


        showError(
          message
        );

      },

      {
        enableHighAccuracy: true,

        timeout: 15000,

        maximumAge: 0

      }
    );

  }


  // =================================================
  // RESET
  // =================================================

  function resetPage() {

    currentPIN = "";

    currentEmployee = null;


    document
      .getElementById(
        "pin"
      )
      .value = "";


    document
      .getElementById(
        "employeeSection"
      )
      .style.display = "none";


    document
      .getElementById(
        "pinSection"
      )
      .style.display = "block";


    document
      .getElementById(
        "pin"
      )
      .focus();


    clearMessage();

    clearLocation();

  }


  // =================================================
  // LOADING
  // =================================================

  function setLoading(
    visible,
    text
  ) {

    const loading =
      document.getElementById(
        "loading"
      );


    if (
      visible
    ) {

      loading.style.display =
        "block";

      loading.textContent =
        text ||
        "Please wait...";

    }

    else {

      loading.style.display =
        "none";

    }

  }


  // =================================================
  // SUCCESS
  // =================================================

  function showSuccess(
    message
  ) {

    const element =
      document.getElementById(
        "message"
      );


    element.textContent =
      message;


    element.className =
      "message success";


    element.style.display =
      "block";

  }


  // =================================================
  // ERROR
  // =================================================

  function showError(
    message
  ) {

    const element =
      document.getElementById(
        "message"
      );


    element.textContent =
      message;


    element.className =
      "message error";


    element.style.display =
      "block";

  }


  // =================================================
  // CLEAR MESSAGE
  // =================================================

  function clearMessage() {

    const element =
      document.getElementById(
        "message"
      );


    element.textContent =
      "";

    element.style.display =
      "none";

  }


  // =================================================
  // CLEAR LOCATION
  // =================================================

  function clearLocation() {

    document
      .getElementById(
        "locationInfo"
      )
      .textContent = "";

  }


  // =================================================
  // ERROR MESSAGE
  // =================================================

  function getErrorMessage(
    error
  ) {

    if (
      error &&
      error.message
    ) {

      return error.message;

    }


    return (
      "Unable to connect to attendance server. " +
      "Please try again."
    );

  }

</script>

</body>

</html>
