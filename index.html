<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#2563eb">

<link rel="manifest"
      href="./manifest.webmanifest">

<title>Employee Attendance</title>


<style>

* {
  box-sizing: border-box;
}

body {

  font-family: Arial, sans-serif;

  background: #f3f4f6;

  text-align: center;

  padding: 30px 15px;

  margin: 0;

}

.box {

  max-width: 420px;

  margin: auto;

  background: white;

  padding: 30px 20px;

  border-radius: 18px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.1);

}

h1 {

  margin-bottom: 25px;

}

input {

  width: 100%;

  padding: 15px;

  font-size: 20px;

  border-radius: 10px;

  border: 1px solid #ccc;

  margin-bottom: 15px;

  box-sizing: border-box;

  text-align: center;

  letter-spacing: 5px;

}

button {

  width: 100%;

  padding: 17px;

  margin: 8px 0;

  border: none;

  border-radius: 10px;

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

}

.verify {

  background: #2563eb;

}

.login {

  background: #16a34a;

}

.logout {

  background: #dc2626;

}

.exit {

  background: #6b7280;

}

.install {

  background: #111827;

}

.hidden {

  display: none;

}

#employeeName {

  font-size: 22px;

  font-weight: bold;

  margin: 15px 0 5px;

}

#weeklyOff {

  color: #666;

  margin-bottom: 15px;

}

#currentStatus {

  margin: 15px 0;

  font-size: 18px;

  font-weight: bold;

}

#message {

  margin-top: 20px;

  font-weight: bold;

}

</style>

</head>


<body>


<div class="box">


<h1>
  Employee Attendance
</h1>


<!-- PIN -->

<div id="loginSection">


<input
  type="password"
  id="pin"
  placeholder="Enter PIN"
  inputmode="numeric"
  maxlength="6"
  autocomplete="off">


<button
  class="verify"
  onclick="verifyEmployee()">

🔐 VERIFY PIN

</button>


<button
  id="installButton"
  class="install hidden"
  onclick="installApp()">

📲 INSTALL APP

</button>


</div>


<!-- EMPLOYEE -->

<div
  id="employeeSection"
  class="hidden">


<div id="employeeName"></div>


<div id="weeklyOff"></div>


<div id="currentStatus">
Current Status
</div>


<button
  class="login"
  onclick="markAttendance('Login')">

🟢 LOGIN

</button>


<button
  class="logout"
  onclick="markAttendance('Logout')">

🔴 LOGOUT

</button>


<button
  class="exit"
  onclick="exitUser()">

🔒 EXIT

</button>


</div>


<div id="message"></div>


</div>


<script>


/* =====================================
   APPS SCRIPT URL
===================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwbUQQ3Ewz3RJHnET6c7YOPVBiWxX-dXJsm0yt58pJGgCp8shePNS0MEQ1AUmopqWzG/exec";

/*
If your NEW deployment gives you
a different URL, replace the URL above.
*/


let verified = false;

let deferredPrompt = null;


/* =====================================
   JSONP API
===================================== */

function callAPI(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "apiCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 10000);


    const script =
      document.createElement("script");


    const query =
      new URLSearchParams(params);


    query.set(
      "api",
      "1"
    );


    query.set(
      "callback",
      callbackName
    );


    script.src =
      API_URL +
      "?" +
      query.toString();


    window[callbackName] =
      function(response) {

        delete window[callbackName];

        script.remove();

        if (response.success) {

          resolve(response.data);

        } else {

          reject(
            new Error(
              response.error ||
              "Something went wrong."
            )
          );

        }

      };


    script.onerror =
      function() {

        delete window[callbackName];

        script.remove();

        reject(
          new Error(
            "Unable to connect to attendance server."
          )
        );

      };


    document.body.appendChild(script);

  });

}


/* =====================================
   VERIFY
===================================== */

async function verifyEmployee() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    showMessage(
      "Please enter your PIN.",
      "red"
    );

    return;

  }


  showMessage(
    "Verifying...",
    "#333"
  );


  try {

    const result =
      await callAPI({

        action: "verify",

        pin: pin

      });


    verified = true;


    document
      .getElementById("loginSection")
      .classList.add("hidden");


    document
      .getElementById("employeeSection")
      .classList.remove("hidden");


    document
      .getElementById("employeeName")
      .textContent =
      "👤 " + result.name;


    document
      .getElementById("weeklyOff")
      .textContent =
      "Weekly Off: " +
      result.weeklyOff;


    updateStatus(
      result.status
    );


    showMessage(
      "✓ Verified successfully.",
      "green"
    );


  } catch (error) {

    showMessage(
      error.message,
      "red"
    );

  }

}


/* =====================================
   LOGIN / LOGOUT
===================================== */

async function markAttendance(action) {

  if (!verified) {
    return;
  }


  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  showMessage(
    "Saving...",
    "#333"
  );


  try {

    const result =
      await callAPI({

        action: "attendance",

        pin: pin,

        attendanceAction: action

      });


    if (action === "Login") {

      showMessage(
        "✓ " +
        result.name +
        " is Logged In",
        "green"
      );


      updateStatus(
        "Login"
      );


    } else {

      showMessage(
        "✓ " +
        result.name +
        " is Logged Out",
        "green"
      );


      updateStatus(
        "Logout"
      );

    }


  } catch (error) {

    showMessage(
      error.message,
      "red"
    );

  }

}


/* =====================================
   STATUS
===================================== */

function updateStatus(status) {

  const box =
    document
      .getElementById(
        "currentStatus"
      );


  if (status === "Login") {

    box.style.color =
      "#16a34a";

    box.textContent =
      "🟢 Current Status: LOGIN";

  } else {

    box.style.color =
      "#dc2626";

    box.textContent =
      "🔴 Current Status: LOGOUT";

  }

}


/* =====================================
   EXIT
===================================== */

function exitUser() {

  verified = false;


  document
    .getElementById(
      "employeeSection"
    )
    .classList.add("hidden");


  document
    .getElementById(
      "loginSection"
    )
    .classList.remove("hidden");


  document
    .getElementById(
      "pin"
    )
    .value = "";


  document
    .getElementById(
      "employeeName"
    )
    .textContent = "";


  document
    .getElementById(
      "weeklyOff"
    )
    .textContent = "";


  document
    .getElementById(
      "currentStatus"
    )
    .textContent =
    "Current Status";


  document
    .getElementById(
      "message"
    )
    .textContent = "";

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(
  text,
  color
) {

  const message =
    document.getElementById(
      "message"
    );


  message.style.color =
    color;


  message.textContent =
    text;

}


/* =====================================
   PWA INSTALL
===================================== */

window.addEventListener(
  "beforeinstallprompt",
  function(event) {

    event.preventDefault();

    deferredPrompt =
      event;


    document
      .getElementById(
        "installButton"
      )
      .classList.remove(
        "hidden"
      );

  }
);


async function installApp() {

  if (!deferredPrompt) {

    alert(
      "Chrome menu → Install App / Add to Home Screen"
    );

    return;

  }


  deferredPrompt.prompt();


  await deferredPrompt.userChoice;


  deferredPrompt = null;


  document
    .getElementById(
      "installButton"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================
   SERVICE WORKER
===================================== */

if (
  "serviceWorker"
  in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        );

    }
  );

}

</script>


</body>

</html>
